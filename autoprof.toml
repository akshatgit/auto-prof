# autoprof backend configuration.
# See autoprof/backends/registry.py for precedence rules (per-kind env var
# > per-kind override below > category env var > category default below >
# hardcoded fallback).

[backends]
# Which Ollama model runs generation. Was a hardcoded constant in
# ollama_cloud.py, so the model that wrote every paper in this system was
# invisible to the config.
#
# Not chosen on a measured quality ranking, because there wasn't one. Two
# rounds of machine-scored probes failed to separate five candidates: the
# first hit the ceiling (all 4/4, including the previous default), and the
# second turned out to be sampling noise -- minimax-m3 scored 0.75 and
# then 1.00 on a re-run of the identical prompt. Latency is the only
# signal that reproduced.
#
# minimax-m3 is the pick on the strength of its actual reasoning rather
# than its score. Asked to prove a false lemma, it refused, built the
# counterexample, and then volunteered why the counterexample needs
# independence systems rather than matroids -- which is precisely the
# distinction whose loss made a real paper here collapse. It is slower
# (~40s against ~21s).
#
# AUTOPROF_OLLAMA_MODEL overrides this.
ollama_model = "minimax-m3"
# A different family reviews generated work. Keeping this separate from
# ollama_model avoids having MiniMax judge its own output in reviewer slot 2.
# AUTOPROF_OLLAMA_REVIEW_MODEL overrides this.
ollama_review_model = "deepseek-v4-pro"
# Reviewer slots 1 and 3 remain Codex; slot 2 moves from the rate-limited
# Claude CLI to the separately configured Ollama Cloud reviewer above.
review_panel = ["codex", "ollama_cloud_review", "codex"]
# Seconds before an Ollama call is abandoned. Was a hardcoded 280 that
# nothing could change, which became a hard ceiling when generation moved
# to a slower model: the longest jobs -- revising a paper against three
# full reviews -- exceeded it on every attempt, so all five retries hit
# the same wall and the task stranded. Keep it comfortably inside the job
# leases (1800s review, 3600s student work).
# AUTOPROF_OLLAMA_TIMEOUT overrides this.
ollama_timeout = 900

[backends.default]
generation = "ollama_cloud"   # student work, professor decompose/callback, memory compaction
review = "codex"              # independent paper/defense review (docs/DESIGN.md §4)
# Generation deliberately stays off codex even though codex is stronger:
# the review panel is codex+DeepSeek, so codex-written papers would be
# judged two-thirds by their own model family. Reviewer independence
# across families is the load-bearing assumption (see review_panel below).

# Uncomment to pin a specific job kind to a specific backend, e.g. to run
# defense review on a different model than paper review:
# [backends.overrides]
# defense_review = "codex"

# Lab policy.
[lab]
# How many ACCEPTED papers a lab works toward. A rejected paper is revised
# and resubmitted until the lab reaches this count -- there is deliberately
# no cap on revision rounds, because rounds measure effort spent while
# accepted papers measure what the lab has to show for it.
max_accepted_papers = 4
# Ceiling on student<->professor supervision meetings per task. A backstop
# so a non-converging loop terminates; the loop normally ends when the
# professor says the work is ready.
max_supervision_rounds = 12
# Rejected papers ONE task may accumulate before it is abandoned. The
# accepted-paper target cannot bound a task that never succeeds, and the
# supervision cap forces a write-up that returns through review into
# supervision -- so without this a task whose result is simply wrong
# rewrites it forever.
max_rejected_papers = 5
# Request-and-response exchanges ONE reviewer may have with the authors
# inside a single review round, before it must return a verdict on what it
# has. Lets a reviewer say "run this and show me" rather than silently
# docking the paper for evidence nobody asked for.
max_review_exchanges = 2
# After this many review rounds, stop patching the same prose and return
# the task to research so the next submission is backed by new evidence.
max_paper_revision_rounds = 3
# Ceiling on collaboration rounds between co-authoring students.
max_collaboration_rounds = 6
# Tasks a professor may open in one decomposition.
max_tasks_per_decomposition = 3

[labs.9]
# Lab 9 authors with Codex (gpt-5.5 -- the global default refuses this
# lab's build-cache prompts as a cybersecurity risk) and reviews with a
# claude/codex/claude panel, so Codex never holds a majority over a paper
# from its own family.
#
# These values are the intended defaults. The live deployment currently
# overrides generation_backend, review_panel and max_supervision_rounds
# through AUTOPROF_*_9 environment variables, which take precedence; the
# running configuration is authoritative over this table.
generation_backend = "codex"
review_panel = ["claude", "codex", "claude"]
max_supervision_rounds = 0   # 0 = unlimited; a round cap is not evidence
max_review_exchanges = 2
max_paper_revision_rounds = 1
